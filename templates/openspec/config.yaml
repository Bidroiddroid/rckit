  Conhecimento caro e armadilhas encontradas
  - O nome do repositório rckit não é o nome do projeto. O projeto gerado deve usar {{PROJECT_NAME}}.
  - Instalar ferramentas na máquina e gerar arquivos do projeto são fluxos diferentes. Use `--new {{PROJECT_NAME}}` ou `--new .` para criar scaffold.
  - `--dry-run` nunca deve instalar pacotes, escrever configs reais, alterar Docker ou exigir verificação final de instalação simulada.
  - MCPs consomem contexto e devem ser opt-in. Não ativar todos por padrão.
  - Credenciais como `GITHUB_PERSONAL_ACCESS_TOKEN`, `DATABASE_URL` e `FIRECRAWL_API_KEY` devem ficar fora do Git.
  - OpenCode v1 e v2 possuem diferenças de schema para MCPs; confirmar documentação oficial antes de alterar configuração avançada.
  - OpenCode pode existir como `opencode` ou `opencode2`; não assumir um único binário.
  - Playwright MCP requer Node.js 20+.
  - Chrome DevTools MCP expõe conteúdo do navegador ao agente; usar somente quando necessário.
  - Firecrawl MCP exige API key.
  - Em Ubuntu/Debian, o pacote `fd-find` pode instalar o binário como `fdfind`.
  - Não sobrescrever arquivos existentes sem confirmação explícita.
  - Estado local, logs, `.env` e arquivos sensíveis devem ser ignorados pelo Git.
  - Terminal via pipe pode perder stdin interativo; scripts remotos devem reconectar `/dev/tty` quando precisarem perguntar algo.
  - Menu com clique depende do terminal. Sempre manter fallback com teclado.

rules:
  proposal:
    - "Manter a proposta objetiva."
    - "Explicar o problema antes da solução."
    - "Evitar detalhes de implementação."
    - "Listar módulos afetados."
    - "Informar BREAKING CHANGES quando existirem."
  design:
    - "Documentar decisões arquiteturais."
    - "Documentar impactos no banco de dados."
    - "Documentar impactos nas APIs."
    - "Documentar impactos na arquitetura."
    - "Explicar alternativas consideradas."
    - "Listar riscos."
    - "Listar mitigação para cada risco."
  specs:
    - "Escrever requisitos em português."
    - "Organizar requisitos por módulo."
    - "Cada requisito deve possuir cenário testável."
    - "Utilizar MUST, SHOULD e MAY quando apropriado."
    - "Evitar ambiguidades."
  tasks:
    - "Dividir tarefas em pequenas entregas."
    - "Respeitar dependências."
    - "Criar checklist de implementação."
    - "Criar checklist de testes."
    - "Criar checklist de documentação."
    - "Finalizar com deploy."
    - "Finalizar com validação da aplicação."
    - "Finalizar com limpeza de cache."
    - "Finalizar com revisão geral do projeto."
