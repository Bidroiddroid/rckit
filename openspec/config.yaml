  Conhecimento caro e armadilhas encontradas
  - O nome do repositório `rckit` não deve virar o nome do projeto gerado. Projeto novo sempre recebe nome explícito via `ai-dev new <nome>` ou `remote-install.sh -- --new <nome>`.
  - O usuário quer rodar um comando único. Manter `remote-install.sh` como fluxo principal para instalar git, clonar/atualizar o repo, aplicar permissões e delegar argumentos.
  - `--dry-run` nunca pode escrever em `$HOME`, criar configs reais, instalar pacotes, alterar Docker ou exigir verificação final de uma instalação simulada.
  - Em Bash, variáveis globais de módulo podem vazar entre componentes. O runtime deve limpar `AI_DEV_MODULE_NAME`, `AI_DEV_MODULE_BINARY` e `AI_DEV_MODULE_APT_PACKAGES` antes de carregar cada módulo.
  - `ai-dev install` sem argumentos não deve selecionar tudo automaticamente. Em terminal interativo, pedir seleção; sem terminal, exigir componentes ou `--profile`.
  - Estado local e logs devem ser ignorados pelo Git.
  - A pasta `.git` do workspace Codex pode estar montada como read-only; para publicar, foi usado repositório temporário em `/tmp`. Não assumir que o workspace local é um repo Git gravável.
  - O repositório remoto já tinha um README inicial; integrar histórico remoto antes de push para evitar sobrescrever.
  - OpenCode possui diferenças de configuração entre versões: v1 usa `permission`, v2 usa `permissions`. Template atual usa defaults conservadores compatíveis com v1 até fixar alvo de versão.
  - OpenCode v2 pode instalar como `opencode2`; não assumir que substitui binário `opencode`.
  - MCPs consomem contexto e podem exigir credenciais ou escopos amplos. Devem permanecer opt-in e com contexto/permissões visíveis no plano.
  - GitHub MCP pode usar token local; nunca escrever `GITHUB_PERSONAL_ACCESS_TOKEN` ou similares em arquivos versionados.
  - Playwright MCP requer Node.js 20+.
  - Chrome DevTools MCP expõe conteúdo do navegador ao agente; manter opt-in.
  - Firecrawl MCP exige API key; manter opt-in e secret-safe.

rules:
  proposal:
    - "Manter a proposta objetiva."
    - "Explicar o problema antes da solução."
    - "Evitar detalhes de implementação."
    - "Listar módulos afetados."
    - "Informar BREAKING CHANGES quando existirem."
    - "Usar dados reais do AI DEV BOOTSTRAP/rckit, não placeholders genéricos."
  design:
    - "Documentar decisões arquiteturais."
    - "Documentar impactos no banco de dados."
    - "Documentar impactos nas APIs."
    - "Documentar impactos na arquitetura."
    - "Explicar alternativas consideradas."
    - "Listar riscos."
    - "Listar mitigação para cada risco."
    - "Preservar armadilhas já aprendidas no projeto."
  specs:
    - "Escrever requisitos em português."
    - "Organizar requisitos por módulo."
    - "Cada requisito deve possuir cenário testável."
    - "Utilizar MUST, SHOULD e MAY quando apropriado."
    - "Evitar ambiguidades."
    - "Transformar cada requisito em comportamento verificável pela CLI, testes ou documentação."
  tasks:
    - "Dividir tarefas em pequenas entregas."
    - "Respeitar dependências."
    - "Criar checklist de implementação."
    - "Criar checklist de testes."
    - "Criar checklist de documentação."
    - "Finalizar com deploy."
    - "Finalizar com validação da aplicação."
    - "Finalizar com limpeza de cache."
    - "Finalizar com revisão geral do projeto."
    - "Não marcar tarefa como concluída quando houver apenas placeholder sem comportamento verificável."
